[tools]
go = "1.25.14"
golangci-lint = "2.13.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# tests grade Rust and TypeScript/Vue/React fixtures with real toolchains
rust = "1.96.1"
node = "26.5.0"

# not ".": _exams starters are question content; a gofmt error fails the && chain
[tasks.fmt]
run = 'files=$(gofmt -l main.go main_test.go internal) && echo "$files" && test -z "$files"'

[tasks.build]
run = "go build ./..."

[tasks.vet]
run = "go vet ./..."

# -short skips verifying the whole embedded bank (main_test.go), which needs over 10 minutes
[tasks.test]
run = "go test -short ./..."

[tasks.tidy]
run = "go mod tidy -diff"

[tasks.vuln]
run = "govulncheck ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.ci]
depends = ["fmt", "build", "vet", "test", "tidy", "vuln", "lint"]
