[tools]
go = "1.25.14"
golangci-lint = "2.13.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# tests grade Rust and TypeScript/Vue/React fixtures with real toolchains
rust = "1.96.1"
node = "26.5.0"

[tasks.fmt]
run = 'test -z "$(gofmt -l main.go main_test.go internal | tee /dev/stderr)"'

[tasks.build]
run = "go build ./..."

[tasks.vet]
run = "go vet ./..."

[tasks.test]
run = "go test -short ./..."

[tasks.tidy]
run = "go mod tidy -diff"

[tasks.vuln]
run = "govulncheck ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.ci]
depends = ["fmt", "build", "vet", "test", "tidy", "vuln", "lint"]
