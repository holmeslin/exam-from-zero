questions:
  - id: vue-ap1-q01
    difficulty: 1
    type: code
    check: test
    prompt: |
      ClickCounter.vue 是用 Options API 寫的計數器，可是按下按鈕數字完全不會變。
      找出問題並修好它，讓每按一次，畫面上的「點了 N 次」就加 1。
    hints: ["methods 裡的 increment 是怎麼寫的？箭頭函式有自己的 this 嗎？", "把 `increment: () => { ... }` 改成 `increment() { ... }` 的寫法"]
    ref: appendix1/c_options_api.md

  - id: vue-ap1-q02
    difficulty: 3
    type: code
    check: test
    prompt: |
      StepCounter.vue 是 Options API 的計數器：每按一次，`count` 加上 prop `step`。
      請在 `watch` 裡監聽 `count`：
      - 每次變化，把「舊值→新值」（例如 `0→3`）加進 `history`
      - 新值大於等於 10 時，發出 `reached` 事件，並把新值當成參數傳出去
    hints: ["watch 的鍵是要監聽的狀態名稱：`count(newValue, oldValue) { ... }`", "用 `this.history.push(...)` 記錄，用 `this.$emit(\"reached\", newValue)` 發出事件"]
    ref: appendix1/c_options_api.md

  - id: vue-ap1-q03
    difficulty: 2
    type: code
    check: test
    prompt: |
      下面是一個用 Options API 寫的元件：

          <script>
          export default {
            props: {
              price: { type: Number, default: 100 },
            },
            data() {
              return { quantity: 1 };
            },
            computed: {
              total() {
                return this.quantity * this.price;
              },
            },
            methods: {
              add() {
                this.quantity++;
              },
            },
          };
          </script>

      請把它翻成 `<script setup lang="ts">` 的寫法，寫在 PriceTag.vue 裡。
      模板已經寫好了，不用改；`price` 沒傳時預設是 100。
    hints: ["data 的每個屬性變成一個 ref，computed 變成 computed()，methods 變成一般的 function", "props 的預設值可以用 `withDefaults(defineProps<{ price?: number }>(), { price: 100 })`；this.xxx 改成 xxx.value 或 props.xxx"]
    ref: appendix1/c_options_api.md

  - id: vue-ap1-q04
    difficulty: 1
    type: code
    check: test
    prompt: |
      SearchBox.vue 裡有一個自訂指令 `vFocus`，模板上用 `v-focus` 套在輸入框上，
      但它現在什麼都沒做。請完成它，讓元件一掛載，輸入框就自動取得焦點。
    hints: ["指令物件裡可以放 `mounted(el) { ... }`，元素放到畫面上之後會執行", "在 mounted 裡呼叫 `el.focus()`"]
    ref: appendix1/d_custom_directives.md

  - id: vue-ap1-q05
    difficulty: 2
    type: code
    check: test
    prompt: |
      HighlightText.vue 的 `v-highlight` 指令要做到兩件事：
      - 把元素的背景色設成指令的值，而且 prop `color` 改變時要跟著變
      - 有 `.bold` 修飾符時 `fontWeight` 設成 `bold`，沒有時設成 `normal`
      現在的版本只在掛載時設一次背景色，請修好它。
    hints: ["把指令改成函式簡寫 `(el, binding) => { ... }`，它在掛載和每次更新時都會執行", "值在 `binding.value`，修飾符在 `binding.modifiers.bold`"]
    ref: appendix1/d_custom_directives.md

  - id: vue-ap1-q06
    difficulty: 3
    type: code
    check: test
    prompt: |
      directives.ts 有兩個問題，請修好：
      1. `registerDirectives(app)` 要把 `vColor` 全域註冊，讓任何元件不用匯入就能寫 `v-color`，但現在模板裡的 `v-color` 找不到指令。
      2. `vColor` 要看參數：寫成 `v-color:background="'yellow'"` 時設定背景色（`backgroundColor`），沒有參數時設定文字顏色（`color`）。
    hints: ["`app.directive` 的第一個參數是指令名字，不含 `v-`", "參數（冒號後面的字）在 `binding.arg`，判斷它是不是 \"background\""]
    ref: appendix1/d_custom_directives.md

  - id: vue-ap1-q07
    difficulty: 2
    type: code
    check: test
    prompt: |
      Heading.ts 是一個用 `h()` 寫的函式元件，應該依照 prop `level` 渲染成 `<h1>` 到 `<h6>` 的其中一個，
      並把 slot 的內容放進去，例如 level 是 2 時渲染 `<h2 class="heading">…</h2>`。
      現在它永遠渲染成 `<h1>`，請修好它。
    hints: ["`h()` 的第一個參數是標籤名稱，可以是動態組出來的字串", "用樣板字串 `` `h${props.level}` `` 當標籤名稱"]
    ref: appendix1/e_render_function_jsx.md

  - id: vue-ap1-q08
    difficulty: 3
    type: code
    check: test
    prompt: |
      HCounter.ts 用 `defineComponent` 和 `h()` 寫了一個按鈕，按下去 `count` 確實會加 1，
      可是畫面一直停在「點了 0 次」。請修好它，讓畫面跟著 `count` 更新。
    hints: ["`count` 變了之後，Vue 會重新呼叫哪個函式？`label` 是在哪裡算出來的？", "把 `` `點了 ${count.value} 次` `` 搬進 render function（`return () => h(...)`）裡面算"]
    ref: appendix1/e_render_function_jsx.md

  - id: vue-ap1-q09
    difficulty: 1
    type: choice
    prompt: |
      用 Tailwind CSS 時，有人寫了 `` :class="`bg-${color}-600`" ``，`color` 是 `"emerald"`，
      開發時畫面上卻沒有綠色背景。最可能的原因是什麼？
    choices:
      - "Tailwind 只產生程式碼裡看得到完整名稱的類別，字串拼接出來的類別名稱掃不到，就沒有產生對應的 CSS"
      - "`:class` 不能和 Tailwind 的類別一起用，要改用 `@apply`"
      - "Tailwind 4 需要在 `tailwind.config.js` 裡登記顏色才能用"
      - "`bg-emerald-600` 要寫在 `<style scoped>` 裡才會生效"
    answer: 0
    hints: ["Tailwind 建置時會掃描你的程式碼，只產生用到的類別", "把完整的類別名稱寫出來，例如 `color === 'emerald' ? 'bg-emerald-600' : 'bg-gray-400'`"]
    ref: appendix1/a_tailwind.md

  - id: vue-ap1-q10
    difficulty: 2
    type: choice
    prompt: |
      create-vue 專案的 `npm run lint` 是 `run-s "lint:*"`，會依序跑 `lint:oxlint` 和 `lint:eslint`。
      如果 Oxlint 回報了一個 error，接下來會怎樣？
    choices:
      - "ESLint 照樣會跑，最後把兩邊的錯誤合併列出"
      - "`run-s` 停下來，ESLint 根本沒有執行"
      - "Oxlint 的 error 會自動降級成 warning，然後繼續跑 ESLint"
      - "ESLint 會先跑，Oxlint 的錯誤最後才顯示"
    answer: 1
    hints: ["`run-s` 是一個接一個跑，前一個失敗會怎樣？", "書上的例子：修好 Oxlint 抓到的問題之後，再跑一次才看到 ESLint 的錯誤"]
    ref: appendix1/b_eslint_prettier.md

  - id: vue-ap1-q11
    difficulty: 2
    type: short
    prompt: |
      用 Vue Router 5 的檔案路由時，想讓所有找不到的網址（例如 `/nope/x`）都顯示 404 頁面，
      要在 `src/pages` 放一個什麼檔名的檔案？（寫出檔名，例如 `about.vue`）
    answers:
      - "^\\[\\.\\.\\.path\\](\\.vue)?$"
      - "^\\[\\.\\.\\.[a-z_][a-z0-9_]*\\](\\.vue)?$"
    hints: ["中括號代表動態參數，例如 `[id].vue`", "三個點代表「剩下全部」，例如 `[...path].vue`"]
    ref: appendix1/f_file_based_routing.md

  - id: vue-ap1-q12
    difficulty: 2
    type: choice
    prompt: |
      Vue 3.6 的 Vapor Mode 要在 `<script setup>` 加上 `vapor` 屬性啟用。
      下面哪一種元件**不能**變成 Vapor 元件？
    choices:
      - "用 `<script setup lang=\"ts\">` 寫、裡面有 `ref` 和 `computed` 的元件"
      - "只有 `<template>`、沒有 `<script>` 的元件"
      - "用 Options API（`data`、`methods`）寫的元件"
      - "模板裡用了 `v-for` 和 `v-if` 的 `<script setup>` 元件"
    answer: 2
    hints: ["Vapor Mode 只支援 `<script setup>`（或只有模板的元件）", "`ref`、`computed`、模板語法在 Vapor Mode 裡都一樣能用"]
    ref: appendix1/g_vapor_mode.md

  - id: vue-ap1-q13
    difficulty: 1
    type: choice
    prompt: |
      用 TanStack Query 時，三個不同的元件都呼叫了 `useQuery`，而且 `queryKey` 都是 `["books"]`。會發生什麼事？
    choices:
      - "三個元件各自抓一次資料，互不相干"
      - "第二個和第三個元件會報錯，因為 queryKey 重複了"
      - "三個元件共用同一份快取，資料只會抓一次"
      - "只有第一個元件拿得到資料，其他兩個的 data 永遠是 undefined"
    answer: 2
    hints: ["`queryKey` 是這筆資料的名字", "名字相同的查詢共用同一份快取"]
    ref: appendix1/h_ecosystem.md
