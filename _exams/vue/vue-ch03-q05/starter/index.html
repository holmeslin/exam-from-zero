<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>報名表</title>
  </head>
  <body>
    <form>
      <p>
        <label>名字：</label>
        <input id="user-name" type="text" placeholder="請輸入名字" />
      </p>
      <p>
        <label for="email">信箱：</label>
        <input id="user-email" type="text" />
      </p>
      <p>
        <input type="radio" name="size-s" value="s" /> 小
        <input type="radio" name="size-m" value="m" /> 中
      </p>
      <p>
        <label for="city">城市：</label>
        <select id="city">
          <option value="taipei">台北</option>
          <option value="taichung">台中</option>
        </select>
      </p>
      <p>
        <input type="checkbox" /> 我同意活動辦法
      </p>
      <button type="submit">送出</button>
    </form>
  </body>
</html>
