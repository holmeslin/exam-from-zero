      - "select! 會同時執行兩個 branch 的大括號，buf 會被兩邊同時修改"
      - "read_exact 回傳 Result，不能放在 select! 的 branch 裡"
    answer: 1
    hints: ["select! 有一個 branch 勝出時，其他還沒完成的 branch 會被 drop，也就是取消", "read_exact 跨多次推進、累積中間進度，它不是 cancellation safe"]
