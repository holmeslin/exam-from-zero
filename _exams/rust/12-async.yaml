questions:
  - id: rust-ch12-q01
    difficulty: 1
    type: choice
    prompt: |
      一個使用**單執行緒** runtime 的 `async` 伺服器，同時掛著一萬個正在等待資料的連線。下面哪個描述最精確？
    choices:
      - "有並行（concurrency），但沒有平行（parallelism）"
      - "有平行，但沒有並行"
      - "兩者都有，因為 async 會自動把工作分到多個 CPU 核心"
      - "兩者都沒有，因為一次只能處理一個連線，要等它結束才換下一個"
    answer: 0
    hints: ["並行是「交錯切換、同時處理很多事」，一條執行緒就做得到；平行需要多個核心同一瞬間一起執行", "咖啡師比喻：一位咖啡師輪流服務多桌，是哪一種？"]
    ref: chapter12/02_why_async.md
  - id: rust-ch12-q02
    difficulty: 1
    type: choice
    prompt: |
      下面的程式執行後會印出什麼？

          async fn say_hello() {
              println!("hello");
          }

          #[tokio::main]
          async fn main() {
              say_hello();
              println!("done");
          }
    choices:
      - "先印 hello，再印 done"
      - "只印 done；編譯器還會對 say_hello(); 這行發出警告"
      - "先印 done，再印 hello（say_hello 在背景執行）"
      - "編譯錯誤：async fn 只能搭配 .await 呼叫"
    answer: 1
    hints: ["呼叫 async fn 只會拿到一個 Future，它是惰性的", "沒有 .await 也沒有人 poll 它，函式本體一行都不會跑；#[must_use] 會提醒你"]
    ref: chapter12/03_async_fn_returns_future.md
  - id: rust-ch12-q03
    difficulty: 2
    type: code
    check: test
    prompt: |
      自己寫一個最陽春的 executor：實作 `block_on<F: Future>(future: F) -> F::Output`。
      它要不斷 `poll` 傳進來的 future，回 `Poll::Pending` 就再 `poll` 一次，回 `Poll::Ready(value)` 就把 `value` 回傳。
      `Context` 用 `Context::from_waker(Waker::noop())` 做就好（這一題的 executor 不睡覺，所以 Waker 用不到）。
    hints: ["poll 需要 Pin<&mut F>：先用 Box::pin(future) 把它釘在 heap 上，每次 poll 前用 .as_mut() 重新借出", "let mut future = Box::pin(future); let mut cx = Context::from_waker(Waker::noop()); 然後 loop { match future.as_mut().poll(&mut cx) { ... } }"]
    ref: chapter12/06_future_trait.md
  - id: rust-ch12-q04
    difficulty: 1
    type: code
    check: test
    prompt: |
      替 `Countdown` 實作 `Future`（`Output = u32`），規則如下：
      每次被 `poll` 都先把 `polls` 加 1；如果 `remaining` 已經是 0，就回傳 `Poll::Ready(polls)`（總共被 poll 的次數）；
      否則把 `remaining` 減 1，回傳 `Poll::Pending`。
      例如 `Countdown::new(2)` 依序 poll 會得到 `Pending`、`Pending`、`Ready(3)`。
    hints: ["Countdown 的欄位都是普通可搬的值，可以用 self.get_mut() 拿回 &mut Countdown 來修改欄位", "let this = self.get_mut(); this.polls += 1; if this.remaining == 0 { Poll::Ready(this.polls) } else { this.remaining -= 1; Poll::Pending }"]
    ref: chapter12/07_delay_future.md
  - id: rust-ch12-q05
    difficulty: 3
    type: code
    check: test
    prompt: |
      完成 `JoinAll` 的 `poll`，讓它把多個 `Future` **並行**推進：
      每次被 `poll` 時，把 `futures` 裡每一個還沒完成（仍是 `Some`）的子 `Future` 各 `poll` 一次；
      完成的就換成 `None`、之後**不准再 poll**（契約二），還沒完成的放回去；全部完成時回 `Ready(())`，否則回 `Pending`。
      隱藏測試會檢查兩個 worker 是否交錯執行（a1、b1、a2、b2），以及已完成的子 `Future` 有沒有被再次 poll。
    hints: ["for slot in &mut this.futures 走訪每個 &mut Option<BoxFuture>；Option::take 可以把 Future 拿出來、原位置留下 None", "if let Some(mut fut) = slot.take() { match fut.as_mut().poll(cx) { Poll::Ready(()) => {}, Poll::Pending => { *slot = Some(fut); all_done = false; } } }"]
    ref: chapter12/09_naive_join.md
  - id: rust-ch12-q06
    difficulty: 2
    type: code
    check: test
    prompt: |
      起始程式碼的 `block_on` 是第 6 集那個會空轉燒 CPU 的版本。請把它改成會睡覺的 executor：
      1. 實作 `ThreadWaker` 的 `wake`：叫醒它記住的那條 `Thread`。
      2. `block_on` 改用 `Waker::from(Arc::new(ThreadWaker { thread: thread::current() }))` 做 `Context`；拿到 `Pending` 就 `thread::park()` 睡覺，被叫醒後再 `poll`。
      隱藏測試會用一個 50ms 後才完成的 Future，檢查它被 `poll` 的次數不能太多。
    hints: ["Thread 有 unpark() 方法；executor 那邊用 thread::park() 睡到被 unpark", "wake 裡寫 self.thread.unpark();，block_on 的 Poll::Pending 分支改成 thread::park()"]
    ref: chapter12/10_waker.md
  - id: rust-ch12-q07
    difficulty: 2
    type: choice
    prompt: |
      手寫 executor 的 `Task::wake` 這樣寫：

          fn wake(self: Arc<Self>) {
              if !self.queued.swap(true, Ordering::SeqCst) {
                  self.queue.lock().expect("鎖失敗").push_back(self.clone());
                  self.executor_thread.unpark();
              }
          }

      為什麼不改成先 `self.queued.load(...)` 檢查是 `false`，再 `self.queued.store(true, ...)`？
    choices:
      - "swap 只是比較快，load 再 store 的結果完全一樣"
      - "wake 可能同時從不同執行緒呼叫；load 和 store 分開時，兩條執行緒可能都讀到 false，把同一個 Task 重複排進 queue"
      - "AtomicBool 沒有 store 方法，只能用 swap"
      - "用 load 會讓已經完成的 Task 再被 poll，違反契約二"
    answer: 1
    hints: ["swap 會「拿到舊值，同時把新值留下」，而且是一次 atomic 操作", "想像兩條執行緒同時對同一個 Task 呼叫 wake，load 和 store 中間有空檔"]
    ref: chapter12/11_spawn_ready_queue.md
  - id: rust-ch12-q08
    difficulty: 3
    type: code
    check: test
    prompt: |
      仿照手寫 runtime 的 `JoinHandle`，完成一對「完成方 / 等待方」：`pair()` 已經寫好，它們共用 `Shared<T>`（裡面是 `(結果, 等待者的 Waker)`）。
      1. `JoinHandle<T>` 的 `poll`：結果已經在就取出來回 `Ready`；還沒好就把**這次** `cx.waker()` 的複本存進共享狀態，回 `Pending`。
      2. `Completer::complete(value)`：把結果放進共享狀態；如果有人存了 `Waker`，就取出來 `wake`。
      隱藏測試也會檢查：被 poll 兩次時，只有最近一次給的 `Waker` 會被叫醒（契約一）。
    hints: ["共享狀態在 self.shared.state，是一個 Mutex：先 lock() 拿到 guard，再用 state.0、state.1 存取兩個欄位", "poll：if let Some(v) = state.0.take() { Poll::Ready(v) } else { state.1 = Some(cx.waker().clone()); Poll::Pending }；complete：state.0 = Some(value); if let Some(w) = state.1.take() { w.wake(); }"]
    ref: chapter12/12_join_handle.md
  - id: rust-ch12-q09
    difficulty: 3
    type: choice
    prompt: |
      手寫 reactor 裡的 `Read::poll` 是「先 `set_waker`，再試 `read`」。如果把順序反過來：
      先試 `read`，拿到 `WouldBlock` 之後才 `set_waker`，可能會發生什麼事？
    choices:
      - "不會有問題，順序只影響效能"
      - "資料剛好在兩步之間到達時，reactor 在 HashMap 裡找不到 Waker 可叫醒，這個 Future 可能永遠不會再被 poll"
      - "read 會回傳 Ok(0)，讓程式以為連線已經關閉"
      - "reactor 會對同一個 Token 叫醒兩次，讓 Task 被重複 poll"
    answer: 1
    hints: ["reactor 收到事件時，是照 Token 去 HashMap 找 Waker 來 wake", "如果事件發生在「試完 read」和「登記 Waker」之間，那次喚醒會落到哪裡？"]
    ref: chapter12/14_reactor.md
  - id: rust-ch12-q10
    difficulty: 3
    type: code
    check: test
    prompt: |
      把下面這個 `async fn` **手寫**成狀態機。`enum AddTwice` 的四個狀態和 `yield_now()` 都已經寫好，請完成 `poll`：

          async fn add_twice(a: i32, b: i32) -> i32 {
              yield_now().await;
              let sum = a + b;
              yield_now().await;
              sum * 2
          }

      `Start` 切到 `First`；`First` 裡的 `YieldNow` 完成時算出 `sum`、切到 `Second`；`Second` 裡的 `YieldNow` 完成時切到 `Done` 並回 `Ready(sum * 2)`；
      子 Future 回 `Pending` 就回 `Pending`。`Done` 狀態再被 poll 要 `panic!`。
      所以 `add_twice(3, 4)` 依序 poll 會得到 `Pending`、`Pending`、`Ready(14)`。
    hints: ["用 let this = self.get_mut(); 再 loop { match this { ... } }，狀態切換寫成 *this = AddTwice::First { ... };", "YieldNow 是 Unpin，可以用 Pin::new(y).poll(cx) 推進它：Ready(()) 就切到下一個狀態繼續 loop，Pending 就 return Poll::Pending"]
    ref: chapter12/15_state_machine.md
