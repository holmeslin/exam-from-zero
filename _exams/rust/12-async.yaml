  - id: rust-ch12-q20
    difficulty: 3
    type: choice
    prompt: |
      下面的迴圈想一邊讀固定長度的封包、一邊每秒印一次心跳：

          loop {
              tokio::select! {
                  r = stream.read_exact(&mut buf) => {
                      r.expect("讀取失敗");
                      handle(&buf);
                  }
                  _ = sleep(Duration::from_secs(1)) => {
                      println!("還活著");
                  }
              }
