    expected_stdout: "請輸入一個正數：\n請再試一次\n請輸入一個正數：\n請再試一次\n請輸入一個正數：\n收到正數！\n"
    hints: ["用 `loop { ... }` 包住「提示、讀取、parse、判斷」整段流程，每一輪都建立新的 `input`", "if num > 0 { println!(\"收到正數！\"); break; } else { println!(\"請再試一次\"); }"]
