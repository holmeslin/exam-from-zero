  - id: rust-ch01-q18
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      寫一個 FizzBuzz 程式，請使用 `for`。讓使用者輸入一個正整數 `n`，從 1 印到 n：同時是 3 和 5 的倍數印 `FizzBuzz`；只是 3 的倍數印 `Fizz`；只是 5 的倍數印 `Buzz`；其他照原樣印出。請用 `&&` 組合兩個條件（不要用 `% 15`）。

      （判定時會輸入 15）
    stdin: "15\n"
    expected_stdout: "請輸入一個正整數：\n1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n"
    hints: ["要包含 n，range 用 `..=`；取餘數用 `%`", "先判斷 i % 3 == 0 && i % 5 == 0，再用 else if 判斷單獨的 3 或 5"]
    ref: chapter1/20_for_range.md
