  - id: rust-ch01-q21
    difficulty: 3
    type: code
    check: stdout
    prompt: |
      請使用者輸入一個正整數 `n`，印出 `2` 到 `n` 之間所有質數，一行一個。請使用 `continue 'outer`：發現某個數可以被其他數整除時，直接跳到下一個候選數。起始程式目前把每個數都印出來了。

