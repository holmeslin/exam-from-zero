  - id: rust-ch01-q17
    difficulty: 3
    type: code
    check: stdout
    prompt: |
      寫一個「存錢達標」程式，請使用 `while`。先讀入目標金額 `goal`，再讀入目前金額 `money`。只要 `money` 還小於 `goal`，每一輪就多存 `30` 元並印出 `目前存到 OOO 元`；達標後印出 `達標！`。

          請輸入目標金額：
          請輸入目前金額：
          目前存到 70 元
          目前存到 100 元
