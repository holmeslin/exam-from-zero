  # 由 EXERCISES.md 第 1 章第 18 集「題 1」轉換
  - id: rust-ch01-q16
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      寫一個程式，用 `loop` 反覆請使用者輸入數字：大於 `0` 就印出 `收到正數！` 並結束；小於或等於 `0` 就印出 `請再試一次`，然後繼續要求輸入。每一輪都先印出 `請輸入一個正數：`。

          請輸入一個正數：
          請再試一次
          請輸入一個正數：
          請再試一次
          請輸入一個正數：
