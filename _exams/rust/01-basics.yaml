  # 由 EXERCISES.md 第 1 章第 9 集「題 1」轉換
  - id: rust-ch01-q07
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      起始程式**目前無法編譯**，因為 `message` 在大括號外面用不到。請只移動 `let message = "Hello";` 這一行，讓程式可以編譯並印出 `Hello`。（不要把 `println!` 移進內層）

