  # 由 EXERCISES.md 第 1 章第 5 集「題 1」轉換
  - id: rust-ch01-q03
    difficulty: 1
    type: code
    check: stdout
    prompt: |
      建立兩個變數 `total = 17` 和 `group = 5`，用這兩個變數（不要把數字寫死在字串裡）印出下面兩行：

          17 / 5 = 3
          17 % 5 = 2
    expected_stdout: "17 / 5 = 3\n17 % 5 = 2\n"
    hints: ["整數除法會捨去小數，`%` 取得餘數；一個 `println!` 可以放多個 `{}`，依序對應後面的值", "println!(\"{} / {} = {}\", total, group, total / group); 第二行把 / 換成 %"]
    ref: chapter1/05_arithmetic_operators.md
  - id: rust-ch01-q04
    difficulty: 1
    type: choice
    prompt: |
      下面這段程式會印出什麼？

          fn main() {
              println!("{}", (1 + 2) * 3 + 4 * 2);
          }
    choices: ["17", "26", "15", "42"]
    answer: 0
    hints: ["Rust 跟數學一樣：括號優先，再來先乘除、後加減", "括號先算：1 + 2 = 3；接著乘法 3 * 3 = 9、4 * 2 = 8；最後相加"]
    ref: chapter1/06_operator_precedence.md
  - id: rust-ch01-q05
    difficulty: 1
    type: short
    prompt: |
      下面這段程式會印出什麼？請直接輸入印出的內容。

          fn main() {
              println!("{}", 7 != 7);
          }
    answers: ["^false$"]
    hints: ["比較運算子的結果只會是 `true` 或 `false`", "`!=` 是「不等於」，7 不等於 7 嗎？"]
    ref: chapter1/07_comparison_operators.md
