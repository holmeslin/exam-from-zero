  - id: rust-ch01-q08
    difficulty: 1
    type: code
    check: stdout
    prompt: |
      建立一個變數 `temperature = 18`。如果 `temperature >= 25`，印出 `熱`；否則印出 `涼`。請用 `if ... else ...`，不要寫成兩個獨立的 `if`。
    expected_stdout: "涼\n"
    hints: ["條件不成立時要做的事放在 `else` 的大括號裡", "if temperature >= 25 { println!(\"熱\"); } else { println!(\"涼\"); }"]
    ref: chapter1/10_else.md
  # 由 EXERCISES.md 第 1 章第 11 集「題 1」轉換
  - id: rust-ch01-q09
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      建立一個變數 `temperature = 32`，用 `if ... else if ... else` 依照下面規則印出結果：
      - `temperature >= 35`：印出 `很熱`
      - `temperature >= 25`：印出 `溫暖`
      - 其他情況：印出 `偏涼`
    expected_stdout: "溫暖\n"
    hints: ["Rust 會從上到下檢查條件，第一個成立的分支執行後就不再往下看，所以要先判斷最嚴格的條件", "if temperature >= 35 { ... } else if temperature >= 25 { ... } else { ... }"]
    ref: chapter1/11_else_if.md
  # 由 EXERCISES.md 第 1 章第 12 集「題 2」轉換
  - id: rust-ch01-q10
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      建立三個變數：`age = 16`、`with_parent = true`、`has_ticket = true`。規則是：**有票**，而且「年滿 18 歲**或者**有家長陪同」，就可以入場。請印出 `可以入場` 或 `不能入場`。

