      （判定時會依序輸入 100、40）
    stdin: "100\n40\n"
    expected_stdout: "請輸入目標金額：\n請輸入目前金額：\n目前存到 70 元\n目前存到 100 元\n達標！\n"
    hints: ["`money` 會在迴圈裡改變，宣告時要用 `let mut`；條件寫成 `while money < goal`", "while money < goal { money += 30; println!(\"目前存到 {} 元\", money); } 迴圈後印出 達標！"]
    ref: chapter1/19_while.md
