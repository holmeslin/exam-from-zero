  - id: rust-ch03-q15
    difficulty: 3
    type: code
    check: test
    prompt: |
      `src/lib.rs` 定義了銀行請求 `enum Request`。請用 `match` guard 完成 `review(r: Request, daily_limit: i32) -> i32`，回傳審核結果的編號：
      - `Transfer` 的 `from == to`（轉給自己）：`0`（拒絕）
      - `Transfer` 的 `amount <= 0`：`0`（拒絕）
      - `Transfer` 的 `amount > daily_limit`：`1`（需要額外確認）
      - 其他 `Transfer`：`2`（直接通過）
