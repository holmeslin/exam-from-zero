  - id: rust-ch03-q01
    difficulty: 1
    type: code
    check: test
    prompt: |
      `src/lib.rs` 已經定義好 `struct Rectangle`，有 `width` 和 `height` 兩個 `i32` 欄位。請完成兩個函式：
      - `area(r: Rectangle) -> i32`：回傳寬乘以高。
      - `is_square(r: Rectangle) -> bool`：寬和高相等時回傳 `true`，否則回傳 `false`。
      （程式碼裡的 `pub` 是讓判定用的測試能使用這些項目，之後才會教，請保留。）
    hints: ["用 `.欄位名` 取值，例如 `r.width`", "`r.width * r.height`；判斷正方形用 `r.width == r.height`"]
