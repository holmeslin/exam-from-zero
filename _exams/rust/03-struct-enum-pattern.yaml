  - id: rust-ch03-q16
    difficulty: 2
    type: choice
    prompt: |
      下面的函式編譯時會怎樣？

          fn sign(n: i32) -> i32 {
              match n {
                  x if x > 0 => 1,
                  x if x < 0 => -1,
                  x if x == 0 => 0,
              }
          }
    choices:
      - 可以編譯，三個 guard 已經涵蓋所有整數
