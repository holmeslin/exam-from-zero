    hints: ["`Command::SetVolume(level @ 0..=100) => level` 之後，再寫一個 `Command::SetVolume(_) => current` 接住超出範圍的", "VolumeUp 可以先算 `let next = current + step;`，再 `match next { v @ 0..=100 => v, ..0 => 0, _ => 100 }`"]
