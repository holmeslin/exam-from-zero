  - id: rust-ch03-q10
    difficulty: 2
    type: code
    check: test
    prompt: |
      請完成 `edge_product(v: &[i32]) -> i32`，用 slice pattern 回傳切片「頭尾兩個元素的乘積」：
      - 空切片回傳 `0`。
      - 只有一個元素時，頭尾都是它，回傳它的平方（`[7]` → `49`）。
