    hints: ["guard 的寫法是 `Request::Transfer { from, to, .. } if from == to => 0`，guard 不成立會繼續往下比對", "有 guard 的分支放前面，最後留一個沒有 guard 的 `Request::Transfer { .. } => 2` 讓編譯器確認已窮舉"]
