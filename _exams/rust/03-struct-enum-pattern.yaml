      - `distance(self) -> i32`：method，回傳 `x` 的絕對值加 `y` 的絕對值。
      測試會這樣串接呼叫：`Robot::new().execute(Command::Move { dx: 2, dy: 3 }).execute(Command::Reset)`。
    hints: ["`execute` 裡 `match cmd { ... }`，每個分支建立新的 `Self { x: ..., y: ..., moves: self.moves + 1 }`", "絕對值可以寫 `if self.x < 0 { -self.x } else { self.x }`；Reset 直接回傳 `Self::new()`"]
