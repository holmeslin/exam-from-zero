  - id: rust-ch03-q21
    difficulty: 3
    type: code
    check: test
    prompt: |
      `src/lib.rs` 定義了 `struct Robot { x, y, moves }` 和指令 `enum Command`。請在 `impl Robot` 裡完成：
      - `Robot::new()`：associated function，回傳在 `(0, 0)`、`moves` 為 0 的機器人。
      - `execute(self, cmd: Command) -> Self`：method，回傳執行指令後的新機器人：
        - `Move { dx, dy }`：座標加上 `dx`、`dy`，`moves` 加 1。
