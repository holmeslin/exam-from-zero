  - id: rust-ch03-q02
    difficulty: 1
    type: choice
    prompt: |
      下面的程式碼編譯時會發生什麼事？

          struct Meters(i32);
          struct Feet(i32);

          fn run(distance: Meters) {
              println!("跑了 {} 公尺", distance.0);
          }

          fn main() {
              run(Feet(5));
          }
    choices:
      - 編譯失敗：`run` 要的是 `Meters`，`Feet` 是另一個型別
      - 可以編譯，印出「跑了 5 公尺」，因為兩者裡面都是一個 `i32`
      - 可以編譯，但執行時會 panic
      - 編譯失敗：tuple `struct` 不能當作函式參數
    answer: 0
    hints: ["想想 tuple `struct` 只看欄位型別，還是連名字也算數", "就算欄位型別完全一樣，`Meters` 和 `Feet` 仍是兩個不同的型別"]
    ref: chapter3/02_tuple_struct_unit_struct.md
  - id: rust-ch03-q03
    difficulty: 1
    type: choice
    prompt: |
      下面的程式碼會怎樣？

          enum Color {
              Red,
              Green,
              Blue,
          }

          fn main() {
              let c = Color::Blue;
              match c {
                  Color::Red => println!("紅色"),
                  Color::Green => println!("綠色"),
              }
          }
    choices:
      - 可以編譯；因為 `c` 是 `Blue`，所以什麼都不印
      - 可以編譯，但執行到 `match` 時會 panic
      - 編譯失敗：`match` 沒有處理 `Color::Blue`，沒有窮舉所有 variant
      - 可以編譯，只會出現一個警告
    answer: 2
    hints: ["`match` 有一條最重要的規則跟「全部」有關", "`match` 必須窮舉所有 variant，少一個就編譯失敗"]
    ref: chapter3/04_match_c_style_enum.md
  - id: rust-ch03-q04
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      `src/main.rs` 已經讀入季節編號並轉成 `Season`。請在 TODO 的地方用 **match 表達式**完成：
      1. 用 `let name = match season { ... };` 算出季節名稱（春天、夏天、秋天、冬天）並印出一行。
      2. 再用一個 `match` 表達式算出穿著建議：春天「薄外套」、夏天「短袖」、秋天「長袖」、冬天「大衣」，
         並印出 `建議穿著：<建議>`。其中秋天的分支要用 block，先印出一行 `早晚溫差大`，再回傳「長袖」。
      輸入 2 時完整輸出：

          請輸入季節編號（0-3）：
          秋天
          早晚溫差大
          建議穿著：長袖

      （判定時會輸入 2）
    stdin: "2\n"
    expected_stdout: "請輸入季節編號（0-3）：\n秋天\n早晚溫差大\n建議穿著：長袖\n"
    hints: ["`let name = match season { Season::Spring => \"春天\", ... };` 結尾別忘了分號", "block 分支寫成 `Season::Autumn => { println!(\"早晚溫差大\"); \"長袖\" }`，最後一行不加分號才是回傳值"]
    ref: chapter3/05_match_as_expression.md
