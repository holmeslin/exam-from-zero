  - id: rust-ch03-q14
    difficulty: 2
    type: code
    check: test
    prompt: |
      `src/lib.rs` 定義了音量指令 `enum Command`。請完成 `apply(current: i32, cmd: Command) -> i32`，回傳執行後的音量：
      - `SetVolume(v)`：`v` 在 0 到 100（含）之間就設成 `v`；超出範圍則忽略這個指令，維持 `current`。
      - `VolumeUp(step)`：音量變成 `current + step`，但結果低於 0 就是 0、高於 100 就是 100（`step` 可能是負的）。
