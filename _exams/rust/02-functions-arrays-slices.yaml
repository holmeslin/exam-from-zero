    ref: chapter2/02_shadowing.md
  - id: rust-ch02-q15
    difficulty: 1
    type: short
    prompt: |
      下面這段程式會印出什麼？請照 `{:?}` 的格式回答。

          let arr = [10, 20, 30, 40, 50];
          println!("{:?}", &arr[1..=3]);
    answers: ['^\[? ?20 ?[, ] ?30 ?[, ] ?40 ?\]?$']
    hints: ["索引從 0 開始；..= 代表連結尾的索引也包含在內", "取索引 1、2、3 三個元素，印出來是 [20, 30, 40]"]
    ref: chapter2/13_slice.md
