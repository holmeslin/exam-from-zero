  - id: rust-ch04-q10
    difficulty: 3
    type: choice
    prompt: |
      下面四段程式碼（都放在 `fn main` 裡），哪一段**可以**通過編譯？

      甲：
          let mut x = 10;
          let r1 = &x;
          let r2 = &mut x;
          *r2 += 1;
          println!("{}", r1);

      乙：
          let mut x = 10;
          let r1 = &x;
          println!("{}", r1);
          let r2 = &mut x;
          *r2 += 1;

      丙：
          let mut x = 10;
          let r1 = &mut x;
          let r2 = &mut x;
          *r1 += 1;
          *r2 += 1;

      丁：
          let r;
          {
              let x = 42;
              r = &x;
          }
          println!("{}", r);
    choices: ["甲", "乙", "丙", "丁"]
    answer: 1
    hints: ["`&` 和 `&mut` 不能同時存在，同一時間也只能有一個 `&mut`；但參考最後一次使用之後，借用就結束了", "丁是懸垂參考；甲、丙在兩個借用都還會被使用時就衝突了，只有乙的 r1 在建立 `&mut` 前就用完"]
    ref: chapter4/07_borrowing_rules.md

