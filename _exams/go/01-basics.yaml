    difficulty: 1
    type: choice
    prompt: |
      下面這段程式會印出什麼？

          for i := 1; i <= 3; i++ {
              fmt.Print(i)
          }
    choices: ["123", "012", "1234", "0123"]
    answer: 0
    hints: ["看清楚起點是 1，條件是 <=", "i 依序是 1、2、3，到 4 時條件不成立"]
    ref: chapter1/20_for_three_part.md
  - id: go-ch01-q02
    difficulty: 1
    type: short
    prompt: 變數 n 的型別是 int，要把它轉成 float64，運算式怎麼寫？
    answers: ["^float64\\(n\\)$"]
    hints: ["Go 的型別轉換寫法是「型別(值)」", "float64(n)"]
    ref: chapter1/27_type_conversion.md
  - id: go-ch01-q03
    difficulty: 2
    type: code
    check: test
    prompt: |
      實作 Grade(score int) string：
      90 分以上回傳 "A"，80～89 回傳 "B"，其他回傳 "C"。請用 switch。
    hints: ["switch 後面不寫值，每個 case 寫條件", "case score >= 90: return \"A\""]
    ref: chapter1/30_switch.md
