  # 由 EXERCISES.md 第 2 章第 8 集「題 2」轉換
  - id: go-ch02-q06
    difficulty: 2
    type: code
    check: test
    prompt: |
      寫一個函式 isLeapYear(year int) bool，判斷是不是閏年：
      能被 4 整除但不能被 100 整除，或能被 400 整除。
      例如 2024 是 true、1900 是 false、2000 是 true。
    hints: ["條件可以用 && 和 || 組合，記得加小括號讓意思清楚；可以直接 return 一個布林運算式", "return (year%4 == 0 && year%100 != 0) || year%400 == 0"]
    ref: chapter2/08_function_return.md
  # 由 EXERCISES.md 第 2 章第 9 集「題 1」轉換
  - id: go-ch02-q07
    difficulty: 2
    type: code
    check: stdout
    prompt: |
      寫一個函式 toHoursMinutes(total int) (int, int)，把總分鐘數換成小時和分鐘。
      main 裡印出 135 和 50 分鐘的結果；再示範只需要小時時，怎麼用 _ 丟掉分鐘。

          135 分鐘 = 2 小時 15 分鐘
          50 分鐘 = 0 小時 50 分鐘
          200 分鐘大約是 3 小時
    expected_stdout: "135 分鐘 = 2 小時 15 分鐘\n50 分鐘 = 0 小時 50 分鐘\n200 分鐘大約是 3 小時\n"
    hints: ["小時是 total / 60，分鐘是 total % 60，return 後面用逗號隔開兩個值", "hours, _ := toHoursMinutes(200)，再 fmt.Println(200, \"分鐘大約是\", hours, \"小時\")"]
