  # 由 EXERCISES.md 第 2 章第 7 集「題 1」轉換
  - id: go-ch02-q05
    difficulty: 1
    type: code
    check: stdout
    prompt: |
      寫一個函式 cheer(name string, times int)，印出 times 次「加油，」加上名字。
      main 裡已經替小明喊 2 次、替阿華喊 3 次，輸出應該是：

          加油， 小明
          加油， 小明
          加油， 阿華
          加油， 阿華
          加油， 阿華
    expected_stdout: "加油， 小明\n加油， 小明\n加油， 阿華\n加油， 阿華\n加油， 阿華\n"
