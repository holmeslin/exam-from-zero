  # 由 EXERCISES.md 第 2 章第 2 集「題 1」轉換
  - id: go-ch02-q01
    difficulty: 1
    type: code
    check: stdout
    prompt: |
      用 iota 宣告四個常數 Spring、Summer、Autumn、Winter，編號從 1 開始。
      再建立變數 season := Autumn，先印出它的編號，再用 switch 印出它的中文名稱。

      預期輸出：

          Autumn 的編號： 3
          秋天
    expected_stdout: "Autumn 的編號： 3\n秋天\n"
    hints: ["在 const ( ... ) 裡，第一行寫 Spring = iota + 1，下面三行只寫名字", "case Spring: 跟 case 1: 意思一樣，但前者好讀很多；印編號用 fmt.Println(\"Autumn 的編號：\", season)"]
