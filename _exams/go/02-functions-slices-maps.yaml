  # 由 EXERCISES.md 第 2 章第 11 集「題 1」轉換
  - id: go-ch02-q09
    difficulty: 2
    type: code
    check: test
    prompt: |
      下面的函式判斷能不能領取包裹，能正確執行但巢狀很深。請改寫成 early return 的風格：
      每種「不能領」的情況先 return，最後才回傳「可以領取」。結果要和原本一樣。

          func checkPickup(hasID bool, code int, days int) string {
              if hasID {
                  if code == 1234 {
                      if days <= 7 {
                          return "可以領取"
                      } else {
                          return "已超過保管期限"
                      }
                  } else {
                      return "取件碼錯誤"
                  }
              } else {
                  return "請出示證件"
              }
          }
    hints: ["原本最外層的條件是 hasID，反過來就是「沒有證件」，先處理它並 return", "依序寫 if !hasID、if code != 1234、if days > 7，各自 return 錯誤訊息，最後 return \"可以領取\""]
    ref: chapter2/11_early_return.md
