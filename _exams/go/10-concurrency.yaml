  - id: go-ch09-q15
    difficulty: 2
    type: code
    check: test
    prompt: |
      完成 Receive(ch <-chan int, d time.Duration) (int, bool)：從 ch 接收一個值，最多等 d 這麼久。
      收到時回傳該值和 true；逾時回傳 0 和 false。
      （隱藏測試用 testing/synctest 的假時鐘，等 10 秒的測試也會瞬間跑完。）
    hints: ["用 select 同時等 ch 和一個鬧鐘", "case v := <-ch: return v, true；case <-time.After(d): return 0, false"]
    ref: chapter9/12_timeout.md
  - id: go-ch09-q16
    difficulty: 3
    type: choice
    prompt: |
      執行 go test 跑下面這個測試，結果會是哪一種？

          func TestSleep(t *testing.T) {
              synctest.Test(t, func(t *testing.T) {
                  start := time.Now()
                  time.Sleep(10 * time.Second)
                  waited := time.Since(start)
                  if waited != 10*time.Second {
                      t.Errorf("等了 %v", waited)
                  }
              })
          }
    choices:
      - "幾乎瞬間跑完，waited 剛好是 10s，測試通過"
      - "真的要等 10 秒，waited 大約是 10s 但有一點誤差，所以測試常常失敗"
      - "幾乎瞬間跑完，但 waited 是 0，測試失敗"
      - "測試失敗：泡泡裡不能呼叫 time.Sleep"
    answer: 0
    hints: ["泡泡裡的時間是假的，不會自己走", "所有 goroutine 都卡住時，假時鐘會直接跳到下一個有事發生的時間點，而且沒有誤差"]
    ref: chapter9/19_synctest.md
