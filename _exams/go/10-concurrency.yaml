    ref: chapter9/17_worker_pool.md
  - id: go-ch09-q14
    difficulty: 2
    type: code
    check: test
    prompt: |
      Generate 已經寫好。請完成 pipeline 的兩個階段 Square 和 OnlyOdd，
      讓 OnlyOdd(Square(Generate(1, 2, 3, 4, 5))) 依序送出 1、9、25 後關閉。
